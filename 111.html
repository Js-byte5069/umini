<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMINI - AI 对话</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f0f;
      color: #d1d1d1;
      height: 100vh;
      overflow: hidden;
    }
    .app {
      display: flex;
      height: 100vh;
    }
    /* 左侧边栏 */
    .sidebar {
      width: 260px;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 20px 16px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .logo {
      font-size: 24px;
      font-weight: 500;
      color: #d1d1d1;
      letter-spacing: -0.5px;
    }
    .btn-new-chat {
      margin-top: 16px;
      width: 100%;
      padding: 12px 16px;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 30px;
      color: #d1d1d1;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-new-chat:hover {
      background: #252525;
      border-color: rgba(255,255,255,0.12);
    }
    .sidebar-history {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
    }
    .history-item {
      padding: 12px 16px;
      margin: 0 8px 4px;
      border-radius: 12px;
      font-size: 14px;
      color: #a0a0a0;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-item:hover {
      background: #1a1a1a;
      color: #d1d1d1;
    }
    .history-item.active {
      background: #1f1f1f;
      color: #d1d1d1;
    }
    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3a3a3a, #2a2a2a);
      flex-shrink: 0;
    }
    .user-name {
      font-size: 14px;
      color: #a0a0a0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 右侧主区域 */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: #0f0f0f;
    }
    .main-header {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 16px;
      font-weight: 500;
      color: #d1d1d1;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message {
      display: flex;
      max-width: 85%;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
    }
    .message.assistant {
      align-self: flex-start;
    }
    .bubble {
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      word-break: break-word;
    }
    .message.user .bubble {
      background: #1a1a1a;
      color: #e0e0e0;
    }
    .message.assistant .bubble {
      background: #1f1f1f;
      color: #d1d1d1;
    }
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 4px 0;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6a6a6a;
      animation: bounce 1.4s ease-in-out infinite both;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }
    .input-area {
      padding: 16px 24px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .input-wrapper {
      display: flex;
      align-items: flex-end;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 12px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: #4a6cf7;
      box-shadow: 0 0 0 2px rgba(74, 108, 247, 0.2);
    }
    #chatInput {
      flex: 1;
      background: transparent;
      border: none;
      color: #e0e0e0;
      font-size: 15px;
      line-height: 1.5;
      resize: none;
      min-height: 24px;
      max-height: 200px;
      outline: none;
      font-family: inherit;
    }
    #chatInput::placeholder {
      color: #6a6a6a;
    }
    .btn-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #4a6cf7;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-left: 8px;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-send:hover {
      background: #5b7cf8;
    }
    .btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-send svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">UMINI</div>
        <button type="button" class="btn-new-chat">新建对话</button>
      </div>
      <div class="sidebar-history" id="historyList">
        <div class="history-item active" data-id="current">新对话</div>
        <div class="history-item" data-id="1">昨天的对话</div>
        <div class="history-item" data-id="2">上周的对话</div>
        <div class="history-item" data-id="3">关于代码的讨论</div>
        <div class="history-item" data-id="4">学习计划</div>
      </div>
      <div class="sidebar-footer">
        <div class="user-avatar"></div>
        <span class="user-name">用户</span>
      </div>
    </aside>
    <main class="main">
      <header class="main-header" id="chatTitle">新对话</header>
      <div class="chat-area" id="chatArea"></div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="chatInput" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button type="button" class="btn-send" id="btnSend" title="发送">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/chat';
    const chatArea = document.getElementById('chatArea');
    const chatInput = document.getElementById('chatInput');
    const btnSend = document.getElementById('btnSend');
    const chatTitle = document.getElementById('chatTitle');
    const historyList = document.getElementById('historyList');

    // 对话历史（模拟）
    const historyTitles = {
      current: '新对话',
      '1': '昨天的对话',
      '2': '上周的对话',
      '3': '关于代码的讨论',
      '4': '学习计划'
    };

    let currentHistoryId = 'current';
    let isStreaming = false;

    // 左侧历史点击切换
    historyList.querySelectorAll('.history-item').forEach(item => {
      item.addEventListener('click', () => {
        historyList.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentHistoryId = item.dataset.id;
        chatTitle.textContent = historyTitles[currentHistoryId] || '新对话';
        // 仅界面效果：清空当前展示区，模拟切换对话
        chatArea.innerHTML = '';
      });
    });

    // 新建对话
    document.querySelector('.btn-new-chat').addEventListener('click', () => {
      historyList.querySelectorAll('.history-item').forEach(i => i.classList.remove('active'));
      const current = historyList.querySelector('[data-id="current"]');
      if (current) current.classList.add('active');
      currentHistoryId = 'current';
      chatTitle.textContent = '新对话';
      chatArea.innerHTML = '';
    });

    // 自动调整输入框高度
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 200) + 'px';
    });

    // 回车发送，Shift+回车换行
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function addMessage(role, content, isStreamingPlaceholder = false) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (isStreamingPlaceholder) {
        bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
      } else {
        bubble.textContent = content;
      }
      div.appendChild(bubble);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    function updateBubbleContent(bubble, text) {
      bubble.textContent = text;
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isStreaming) return;

      chatInput.value = '';
      chatInput.style.height = 'auto';

      addMessage('user', text);
      const assistantBubble = addMessage('assistant', '', true);
      isStreaming = true;
      btnSend.disabled = true;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        if (!response.ok) {
          const reader = response.body?.getReader();
          let errMsg = response.statusText;
          if (reader) {
            const { value } = await reader.read();
            if (value) errMsg = new TextDecoder().decode(value);
          }
          throw new Error(errMsg || '请求失败');
        }

        const reader = response.body?.getReader();
        const decoder = new TextDecoder();
        let fullText = '';

        if (!reader) {
          const data = await response.json();
          fullText = data.reply || data.message || data.text || JSON.stringify(data);
          updateBubbleContent(assistantBubble, fullText);
          return;
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          fullText += decoder.decode(value, { stream: true });
          updateBubbleContent(assistantBubble, fullText);
        }

        if (!fullText) updateBubbleContent(assistantBubble, '（无回复内容）');
      } catch (err) {
        updateBubbleContent(assistantBubble, '请求失败：' + (err.message || '网络错误，请确认后端已启动'));
      } finally {
        isStreaming = false;
        btnSend.disabled = false;
      }
    }

    btnSend.addEventListener('click', sendMessage);
  </script>
</body>
</html>
