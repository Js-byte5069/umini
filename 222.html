<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMINI - AI 助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1440px;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
        }

        /* 左侧边栏 - 浅灰色 */
        .sidebar {
            width: 260px;
            background-color: #f7f7f8;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            color: #2d2d2d;
        }

        .sidebar-header {
            padding: 24px 16px 16px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #9aa3b8;  /* 浅灰色 */
            margin-bottom: 24px;
            cursor: default;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 0;
            background-color: #ffffff;
            border: 1px solid #d9d9e3;
            border-radius: 8px;
            color: #2d2d2d;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .new-chat-btn:hover {
            background-color: #f0f0f0;
            border-color: #9aa3b8;  /* 浅灰色 */
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #4a4a4a;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: transparent;
            border: none;
            text-align: left;
            width: 100%;
        }

        .history-item:hover {
            background-color: #e5e5e5;
            color: #2d2d2d;
        }

        .history-item.active {
            background-color: #e5e5e5;
            color: #2d2d2d;
            font-weight: 500;
        }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #e5e5e5;
            font-size: 13px;
            color: #8e8ea0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #9aa3b8;  /* 浅灰色 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        .user-name {
            color: #4a4a4a;
            font-weight: 500;
        }

        /* 右侧主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #2d2d2d;
            font-size: 16px;
            font-weight: 500;
            background-color: #ffffff;
        }

        .chat-title {
            color: #8e8ea0;
            font-size: 14px;
            font-weight: 400;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            scroll-behavior: smooth;
            background-color: #ffffff;
        }

        .message-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .message {
            display: flex;
            margin-bottom: 24px;
            gap: 16px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #9aa3b8;  /* 浅灰色 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            flex-shrink: 0;
        }

        .user .avatar {
            background-color: #8e8ea0;  /* 用户头像用稍深一点的灰 */
        }

        .assistant .avatar {
            background-color: #9aa3b8;  /* 浅灰色 */
        }

        .bubble {
            max-width: calc(100% - 48px);
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
            background-color: #f7f7f8;
            color: #2d2d2d;
        }

        .user .bubble {
            background-color: #9aa3b8;  /* 浅灰色 */
            color: white;
        }

        .loading-bubble {
            background-color: #f7f7f8;
            color: #8e8ea0;
            padding: 12px 16px;
            border-radius: 8px;
            display: inline-block;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #8e8ea0;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* 输入区域 */
        .input-area {
            padding: 24px;
            border-top: 1px solid #e5e5e5;
            background-color: #ffffff;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            background-color: #ffffff;
            border-radius: 24px;
            border: 1px solid #d9d9e3;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .input-wrapper:focus-within {
            border-color: #9aa3b8;  /* 浅灰色 */
            box-shadow: 0 0 0 2px rgba(154, 163, 184, 0.1);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 20px;
            color: #2d2d2d;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        #message-input::placeholder {
            color: #8e8ea0;
        }

        #send-btn {
            background: transparent;
            border: none;
            color: #9aa3b8;  /* 浅灰色 */
            font-size: 20px;
            padding: 0 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #send-btn:hover {
            color: #7e8a9e;  /* 稍深一点的灰 */
        }

        #send-btn:disabled {
            color: #d9d9e3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">UMINI</div>
                <button class="new-chat-btn" onclick="newChat()">
                    <span>+</span> 新建对话
                </button>
            </div>
            <div class="history-list">
                <button class="history-item active">新对话</button>
                <button class="history-item">昨天的对话</button>
                <button class="history-item">上周的对话</button>
                <button class="history-item">关于 AI 的问题</button>
            </div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-name">访客用户</div>
                </div>
            </div>
        </div>

        <!-- 右侧主区域 -->
        <div class="main">
            <div class="chat-header">
                <span>新对话</span>
                <span class="chat-title">UMINI AI 助手</span>
            </div>

            <!-- 聊天区域 -->
            <div class="chat-container" id="chat-container">
                <div class="message-wrapper">
                    <!-- 欢迎消息 -->
                    <div class="message assistant">
                        <div class="avatar">🤖</div>
                        <div class="bubble">你好！我是 UMINI AI 助手，有什么可以帮你的吗？</div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="发送消息..." rows="1"></textarea>
                    <button id="send-btn" disabled>📤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        let isLoading = false;

        // 输入框事件
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '' || isLoading;
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function newChat() {
            const wrapper = document.querySelector('.message-wrapper');
            wrapper.innerHTML = `
                <div class="message assistant">
                    <div class="avatar">🤖</div>
                    <div class="bubble">你好！我是 UMINI AI 助手，有什么可以帮你的吗？</div>
                </div>
            `;
        }

        function addMessage(role, content) {
            const wrapper = document.querySelector('.message-wrapper');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            wrapper.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoadingIndicator() {
            const wrapper = document.querySelector('.message-wrapper');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-indicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            
            const bubble = document.createElement('div');
            bubble.className = 'loading-bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            
            loadingDiv.appendChild(avatar);
            loadingDiv.appendChild(bubble);
            wrapper.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loading = document.getElementById('loading-indicator');
            if (loading) loading.remove();
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            addMessage('user', message);
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            isLoading = true;
            addLoadingIndicator();

            try {
                const response = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                removeLoadingIndicator();

                const wrapper = document.querySelector('.message-wrapper');
                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.className = 'message assistant';
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = '🤖';
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.id = 'ai-response';
                
                aiMessageDiv.appendChild(avatar);
                aiMessageDiv.appendChild(bubble);
                wrapper.appendChild(aiMessageDiv);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiResponse = '';
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    buffer += chunk;
                    
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    aiResponse += parsed.content;
                                    bubble.textContent = aiResponse;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {
                                console.log('解析失败:', data);
                            }
                        }
                    }
                }
            } catch (error) {
                removeLoadingIndicator();
                addMessage('assistant', `❌ 错误: ${error.message}`);
                console.error('Fetch error:', error);
            } finally {
                isLoading = false;
                sendBtn.disabled = messageInput.value.trim() === '';
            }
        }
    </script>
</body>
</html>
