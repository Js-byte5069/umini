<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMINI - AI 助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 1440px;
            height: 100vh;
            background-color: #ffffff;
            display: flex;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
            position: relative;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 260px;
            background-color: #f7f7f8;
            border-right: 1px solid #e5e5e5;
            display: flex;
            flex-direction: column;
            color: #2d2d2d;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 10;
        }

        .sidebar.collapsed {
            transform: translateX(-260px);
        }

        /* 收起/展开按钮 - 极小版 */
        .toggle-sidebar-btn {
            position: absolute;
            left: 260px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 32px;
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            border-left: none;
            border-radius: 0 4px 4px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: left 0.3s ease;
            color: #8e8ea0;
            font-size: 10px;
            box-shadow: 1px 0 4px rgba(0,0,0,0.05);
            line-height: 1;
            padding: 0;
        }

        .sidebar.collapsed + .toggle-sidebar-btn {
            left: 0;
        }

        .toggle-sidebar-btn:hover {
            background-color: #f0f0f0;
            color: #2d2d2d;
        }

        .sidebar-header {
            padding: 24px 16px 16px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #9aa3b8;
            margin-bottom: 24px;
            cursor: default;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 0;
            background-color: #ffffff;
            border: 1px solid #d9d9e3;
            border-radius: 8px;
            color: #2d2d2d;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .new-chat-btn:hover {
            background-color: #f0f0f0;
            border-color: #9aa3b8;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #4a4a4a;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background-color: transparent;
            border: none;
            text-align: left;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item:hover {
            background-color: #e5e5e5;
            color: #2d2d2d;
        }

        .history-item.active {
            background-color: #e5e5e5;
            color: #2d2d2d;
            font-weight: 500;
        }

        .delete-btn {
            opacity: 0;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background-color: transparent;
            border: none;
            color: #8e8ea0;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 10;
        }

        .history-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background-color: #d9d9e3;
            color: #ff4d4f;
        }

        .sidebar-footer {
            padding: 20px 16px;
            border-top: 1px solid #e5e5e5;
            font-size: 13px;
            color: #8e8ea0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background-color: #9aa3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 500;
        }

        .user-name {
            color: #4a4a4a;
            font-weight: 500;
        }

        /* 右侧主区域 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            position: relative;
            transition: margin-left 0.3s ease;
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #2d2d2d;
            font-size: 16px;
            font-weight: 500;
            background-color: #ffffff;
        }

        .chat-title {
            color: #8e8ea0;
            font-size: 14px;
            font-weight: 400;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            scroll-behavior: smooth;
            background-color: #ffffff;
        }

        .message-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .message {
            display: flex;
            margin-bottom: 24px;
            gap: 16px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        /* 隐藏所有头像 */
        .message .avatar {
            display: none;
        }

        .bubble {
            max-width: calc(100% - 48px);
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            font-size: 15px;
            word-break: break-word;
            background-color: #f7f7f8;
            color: #2d2d2d;
        }

        .user .bubble {
            background-color: #9aa3b8;
            color: white;
        }

        .loading-bubble {
            background-color: #f7f7f8;
            color: #8e8ea0;
            padding: 12px 16px;
            border-radius: 8px;
            display: inline-block;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #8e8ea0;
            border-radius: 50%;
            display: inline-block;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) { animation-delay: 0s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* 输入区域 */
        .input-area {
            padding: 24px;
            border-top: 1px solid #e5e5e5;
            background-color: #ffffff;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            background-color: #ffffff;
            border-radius: 24px;
            border: 1px solid #d9d9e3;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .input-wrapper:focus-within {
            border-color: #9aa3b8;
            box-shadow: 0 0 0 2px rgba(154, 163, 184, 0.1);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 20px;
            color: #2d2d2d;
            font-size: 15px;
            outline: none;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        #message-input::placeholder {
            color: #8e8ea0;
        }

        #send-btn {
            background: transparent;
            border: none;
            color: #9aa3b8;
            font-size: 20px;
            padding: 0 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        #send-btn:hover {
            color: #7e8a9e;
        }

        #send-btn:disabled {
            color: #d9d9e3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">UMINI</div>
                <button class="new-chat-btn" id="new-chat-btn">
                    <span>+</span> 新建对话
                </button>
            </div>
            <div class="history-list" id="history-list"></div>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-name">访客用户</div>
                </div>
            </div>
        </div>

        <!-- 收起/展开按钮 -->
        <div class="toggle-sidebar-btn" id="toggle-sidebar-btn">◀</div>

        <!-- 右侧主区域 -->
        <div class="main">
            <div class="chat-header">
                <span id="current-chat-title">新对话</span>
                <span class="chat-title">UMINI AI 助手</span>
            </div>

            <!-- 聊天区域 -->
            <div class="chat-container" id="chat-container">
                <div class="message-wrapper" id="message-wrapper"></div>
            </div>

            <!-- 输入区域 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="发送消息..." rows="1"></textarea>
                    <button id="send-btn" disabled>📤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 数据存储
        let chats = JSON.parse(localStorage.getItem('umini_chats')) || [];
        let currentChatId = null;
        let isLoading = false;

        // DOM 元素
        const chatContainer = document.getElementById('chat-container');
        const messageWrapper = document.getElementById('message-wrapper');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const historyList = document.getElementById('history-list');
        const currentChatTitle = document.getElementById('current-chat-title');
        const newChatBtn = document.getElementById('new-chat-btn');
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar-btn');

        // 侧边栏收起状态
        let isSidebarCollapsed = false;

        // 切换侧边栏
        toggleBtn.addEventListener('click', function() {
            isSidebarCollapsed = !isSidebarCollapsed;
            if (isSidebarCollapsed) {
                sidebar.classList.add('collapsed');
                toggleBtn.innerHTML = '▶';
            } else {
                sidebar.classList.remove('collapsed');
                toggleBtn.innerHTML = '◀';
            }
        });

        // 初始化
        function init() {
            if (chats.length === 0) {
                createNewChat();
            } else {
                currentChatId = chats[0].id;
                renderHistoryList();
                loadChat(currentChatId);
            }
        }

        // 保存到 localStorage
        function saveChats() {
            localStorage.setItem('umini_chats', JSON.stringify(chats));
        }

        // 渲染历史记录列表
        function renderHistoryList() {
            historyList.innerHTML = '';
            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                item.setAttribute('data-chat-id', chat.id);
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = chat.title;
                titleSpan.style.flex = '1';
                titleSpan.style.overflow = 'hidden';
                titleSpan.style.textOverflow = 'ellipsis';
                titleSpan.style.whiteSpace = 'nowrap';
                
                // 直接绑定点击事件到整个 item
                item.onclick = (e) => {
                    // 如果点击的是删除按钮，不触发切换
                    if (e.target.classList.contains('delete-btn')) {
                        return;
                    }
                    switchChat(chat.id);
                };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.innerHTML = '×';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                };
                
                item.appendChild(titleSpan);
                item.appendChild(deleteBtn);
                historyList.appendChild(item);
            });
        }

        // 创建新对话
        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: '新对话',
                messages: [
                    { role: 'assistant', content: '你好！我是 UMINI AI 助手，有什么可以帮你的吗？' }
                ],
                createdAt: new Date().toLocaleString()
            };
            chats.push(newChat);
            saveChats();
            currentChatId = newChat.id;
            renderHistoryList();
            loadChat(currentChatId);
        }

        // 切换对话
        function switchChat(chatId) {
            console.log('切换对话:', chatId);
            currentChatId = chatId;
            renderHistoryList();
            loadChat(chatId);
        }

        // 删除对话
        function deleteChat(chatId) {
            console.log('删除对话:', chatId);
            if (chats.length === 1) {
                alert('至少保留一个对话');
                return;
            }
            chats = chats.filter(chat => chat.id !== chatId);
            saveChats();
            if (currentChatId === chatId) {
                currentChatId = chats[0].id;
            }
            renderHistoryList();
            loadChat(currentChatId);
        }

        // 加载对话内容
        function loadChat(chatId) {
            console.log('加载对话:', chatId);
            const chat = chats.find(c => c.id === chatId);
            if (!chat) {
                console.error('对话不存在:', chatId);
                return;
            }
            
            currentChatTitle.textContent = chat.title;
            messageWrapper.innerHTML = '';
            
            chat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.role}`;
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.textContent = msg.content;
                
                msgDiv.appendChild(bubble);
                messageWrapper.appendChild(msgDiv);
            });
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // 添加消息到当前对话
        function addMessage(role, content) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            chat.messages.push({ role, content });
            
            // 如果是第一条用户消息，更新标题
            if (role === 'user' && chat.messages.filter(m => m.role === 'user').length === 1) {
                chat.title = content.substring(0, 15) + (content.length > 15 ? '...' : '');
                currentChatTitle.textContent = chat.title;
            }
            
            saveChats();
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;
            
            msgDiv.appendChild(bubble);
            messageWrapper.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            renderHistoryList();
        }

        // 加载动画
        function addLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-indicator';
            
            const bubble = document.createElement('div');
            bubble.className = 'loading-bubble';
            bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
            
            loadingDiv.appendChild(bubble);
            messageWrapper.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingIndicator() {
            const loading = document.getElementById('loading-indicator');
            if (loading) loading.remove();
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            addMessage('user', message);
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            isLoading = true;
            addLoadingIndicator();

            try {
                const response = await fetch('http://localhost:3000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                removeLoadingIndicator();

                const chat = chats.find(c => c.id === currentChatId);
                if (!chat) return;

                const aiMessageDiv = document.createElement('div');
                aiMessageDiv.className = 'message assistant';
                
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.id = 'ai-response';
                
                aiMessageDiv.appendChild(bubble);
                messageWrapper.appendChild(aiMessageDiv);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiResponse = '';
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    buffer += chunk;
                    
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const parsed = JSON.parse(data);
                                if (parsed.content) {
                                    aiResponse += parsed.content;
                                    bubble.textContent = aiResponse;
                                    chatContainer.scrollTop = chatContainer.scrollHeight;
                                }
                            } catch (e) {
                                console.log('解析失败:', data);
                            }
                        }
                    }
                }
                
                chat.messages.push({ role: 'assistant', content: aiResponse });
                saveChats();
                
            } catch (error) {
                removeLoadingIndicator();
                addMessage('assistant', `❌ 错误: ${error.message}`);
                console.error('Fetch error:', error);
            } finally {
                isLoading = false;
                sendBtn.disabled = messageInput.value.trim() === '';
            }
        }

        // 事件监听
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '' || isLoading;
        });

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        newChatBtn.addEventListener('click', createNewChat);

        // 启动
        init();
    </script>
</body>
</html>
